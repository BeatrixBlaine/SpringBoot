<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Employee Directory</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

</head>
<body>

<div class="container">

    <br>
    <h1>Employee Directory</h1>
    <hr>
    <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- Left side -->
        <div sec:authorize="hasRole('MANAGER')">
            <a th:href="@{/employees/add-employee}"
               class="btn btn-primary btn-sm">
                Add Employee
            </a>

            <a th:href="@{/employees/list}"
               class="btn btn-info btn-sm">
                Default Order
            </a>

            <a th:href="@{/employees/list-by-lastname}"
               class="btn btn-info btn-sm">
                Sort By Last Name
            </a>
        </div>

        <!-- Right side -->
        <div class="d-flex align-items-center gap-3">
        <span>
            Welcome,
            <strong sec:authentication="principal.username"></strong>
            (<span sec:authentication="principal.authorities"></span>)
        </span>

            <form th:action="@{/logout}" method="POST" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Country</th>
                <th>Gender</th>
                <th>Hobby</th>
                <th sec:authorize="hasRole('MANAGER')">Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="tempEmployee : ${employees}">
                <td th:text="${tempEmployee.firstName}"></td>
                <td th:text="${tempEmployee.lastName}"></td>
                <td th:text="${tempEmployee.email}"></td>
                <td th:text="${tempEmployee.country}"></td>
                <td th:text="${tempEmployee.gender}"></td>
                <td th:text="${#strings.listJoin(tempEmployee.hobby, ', ')}"></td>
                <td sec:authorize="hasRole('MANAGER')">
                    <a class="btn btn-info btn-sm"
                       th:href="@{/employees/update-employee(employeeId=${tempEmployee.id})}">
                        Update</a>
                    <form th:action="@{/employees/delete}"
                          method="POST"
                          class="d-inline">

                        <input type="hidden"
                               name="employeeId"
                               th:value="${tempEmployee.id}">

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                onclick="if (!(confirm('Delete this employee?'))) return false">
                            Delete
                        </button>

                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
