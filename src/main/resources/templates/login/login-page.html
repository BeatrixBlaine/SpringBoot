<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login Page</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>
<div class="container">
  <div id="loginbox" style="margin-top: 50px;" class="col-md-3 col-md-offset-2 col-sm-6 col-sm-offset-2">
    <div class="card border-info">
      <div class="card-header bg-info">
        Sign In
      </div>

      <div class="card-body">
        <div class="card-text">

          <!-- Login Form -->
          <form action="#" th:action="@{/authenticateTheUser}" method="POST" class="form-horizontal">

            <!-- Place for messages: error, alert etc ... -->
            <div class="form-group">
              <div class="col-xs-15">
                <div>
                  <!-- Check for login error -->
                  <div>

                      <div class="alert alert-danger col-xs-offset-1 col-xs-10" th:if="${param.error}">
                          Invalid username and password.
                      </div>

                  </div>

                  <!-- Check for logout -->
                  <div>

                    <div class="alert alert-danger col-xs-offset-1 col-xs-10" th:if="${param.logout}">
                      Logged out
                    </div>

                  </div>

                  <!-- Registration success -->
                  <div>

                    <div th:if="${param.registered}" class="alert alert-success">
                      Account created successfully! You can now log in.
                    </div>

                  </div>
                </div>
              </div>
            </div>

            <!-- Username -->
            <div style="margin-bottom: 25px;" class="input-group">
              <input type="text" name="username" placeholder="username" class="form-control" />
            </div>

            <!-- Password -->
            <div style="margin-bottom: 25px;" class="input-group">
              <input type="password" name="password" placeholder="password" class="form-control" />
            </div>

            <!-- Login/Submit Button -->
            <div style="margin-top: 10px;" class="form-group">
              <div class="col-sm-6 controls">
                <button type="submit" class="btn btn-success">Login</button>
              </div>
            </div>

          </form>
          <br>
          <a th:href="@{/register}">Create an account</a>

        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
